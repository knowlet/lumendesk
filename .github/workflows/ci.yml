name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libgl1-mesa-dev
      - name: Select tested Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0
          rustc --version
          node --version
      - name: Install locked TypeScript tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run formatting, tests, lint, examples and TypeScript checks
        run: sh scripts/verify.sh
      - name: Cache all target dependencies for the offline archive regression
        run: |
          cargo fetch --locked
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          cargo run -p lumendesk-cli --locked -- new "$fixture/web-cache" --mode web
          cargo generate-lockfile --offline --manifest-path "$fixture/web-cache/Cargo.toml"
          cargo fetch --locked --manifest-path "$fixture/web-cache/Cargo.toml"
      - name: Verify relocated web source archive and bundled SDK tests
        run: cargo test -p lumendesk-cli --test package --locked real_web_source_archive_builds_and_retains_sdk_test_fixtures -- --ignored --exact

  desktop-platform-builds:
    name: desktop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select tested Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          rustc -vV
      - name: Test display-free typed bridge and lifecycle contracts
        run: cargo test -p lumendesk-core --locked
      - name: Compile and link the CLI
        run: cargo build -p lumendesk-cli --locked
      - name: Test portable archive paths, links and integrity without GUI
        run: cargo test -p lumendesk-cli --lib --test package --locked
      - name: Test SDK contracts without creating OS windows
        run: cargo test -p lumendesk --lib --all-features --locked
      - name: Compile and link all native and webview examples
        run: cargo build -p lumendesk --all-features --examples --locked
