[package]
name = "lumendesk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
native = ["dep:eframe"]
webview = ["dep:wry", "dep:tao"]
[dependencies]
lumendesk-core = { path = "../lumendesk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "__screenshot"] }
wry = { version = "0.57", optional = true }
tao = { version = "0.35", optional = true }
[[example]]
name = "native_form"
required-features = ["native"]
[[example]]
name = "web_form"
required-features = ["webview"]

[[example]]
name = "web_multiwindow"
required-features = ["webview"]

[[example]]
name = "web_stream"
required-features = ["webview"]
